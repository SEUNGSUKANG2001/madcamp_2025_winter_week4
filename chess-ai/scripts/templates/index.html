<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess AI</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Chessboard.js -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <!-- Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #board {
            width: 400px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        #status {
            font-size: 18px;
            font-weight: bold;
        }

        #value-display {
            margin-top: 10px;
            font-size: 16px;
            color: #ecf0f1;
        }

        #move-evaluations {
            margin-top: 20px;
            max-width: 600px;
            background-color: #34495e;
            padding: 15px;
            border-radius: 8px;
        }

        #move-evaluations h3 {
            margin-top: 0;
            color: #ecf0f1;
        }

        #evaluations-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .eval-item {
            padding: 8px;
            margin: 5px 0;
            background-color: #2c3e50;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        .eval-item.best {
            background-color: #27ae60;
            font-weight: bold;
        }

        .eval-move {
            font-family: monospace;
            font-size: 14px;
        }

        .eval-value {
            color: #3498db;
        }

        .eval-item.best .eval-value {
            color: #ecf0f1;
        }
    </style>
</head>

<body>

    <h1>Play against Chess AI</h1>

    <div id="board"></div>

    <div class="controls">
        <button id="resetBtn">New Game</button>
        <button id="flipBtn">Flip Board</button>
    </div>

    <div id="status">Your Turn (White)</div>
    <div style="margin-top: 15px;">
        <div id="ai-eval" style="color: #3498db; font-weight: bold; font-size: 18px;">Selected Move Probability: 0.0000
        </div>
    </div>

    <div id="move-evaluations">
        <h3>Move Evaluations</h3>
        <div id="evaluations-list">No moves evaluated yet</div>
    </div>

    <script>
        var board = null
        var game = new Chess()
        var $status = $('#status')
        var $userEval = $('#user-eval')
        var $aiEval = $('#ai-eval')
        var $fen = $('#fen')
        var $pgn = $('#pgn')

        function onDragStart(source, piece, position, orientation) {
            // do not pick up pieces if the game is over
            if (game.game_over()) return false

            // only pick up pieces for White (user's side)
            if (piece.search(/^b/) !== -1) {
                return false  // User can't move black pieces
            }

            // Can only move when it's white's turn
            if (game.turn() === 'b') {
                return false
            }
        }

        function onDrop(source, target) {
            // see if the move is legal
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // NOTE: always promote to a queen for example simplicity
            })

            // illegal move
            if (move === null) return 'snapback'

            updateStatus()

            // Make AI move
            makeAIMove()
        }

        function onSnapEnd() {
            board.position(game.fen())
        }

        function updateStatus() {
            var status = ''

            var moveColor = 'White'
            if (game.turn() === 'b') {
                moveColor = 'Black'
            }

            // checkmate?
            if (game.in_checkmate()) {
                status = 'Game over, ' + moveColor + ' is in checkmate.'
            }
            // draw?
            else if (game.in_draw()) {
                status = 'Game over, drawn position'
            }
            // game still on
            else {
                status = moveColor + ' to move'
                // check?
                if (game.in_check()) {
                    status += ', ' + moveColor + ' is in check'
                }
            }

            $status.html(status)
        }

        async function makeAIMove() {
            $status.html('AI is thinking...')

            try {
                const response = await fetch('/move', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ fen: game.fen() }),
                });

                const data = await response.json();

                if (data.error) {
                    console.error('Error:', data.error);
                    $status.html('Error: ' + data.error);
                    return;
                }

                if (data.game_over) {
                    $status.html('Game Over: ' + data.result);
                    $aiEval.text('N/A');
                    $userEval.text('N/A');
                    return;
                }

                // Update game with AI move
                game.move(data.move, { sloppy: true }); // sloppy allows SAN or other formats if needed, but UCI is precise
                board.position(game.fen());

                // Update probability display
                // data.value is now the POLICY PROBABILITY (0-1)
                var probability = data.value;

                $aiEval.text('Selected Move Probability: ' + probability.toFixed(6));

                // Display move evaluations (all as probabilities)
                if (data.move_evaluations && data.move_evaluations.length > 0) {
                    let evalHtml = '';
                    data.move_evaluations.forEach((eval, index) => {
                        const isBest = index === 0; // First item is best (sorted by value)
                        const className = isBest ? 'eval-item best' : 'eval-item';
                        evalHtml += `
                            <div class="${className}">
                                <span class="eval-move">${eval.move}</span>
                                <span class="eval-value">${eval.value.toFixed(4)}</span>
                            </div>
                        `;
                    });
                    $('#evaluations-list').html(evalHtml);
                } else {
                    $('#evaluations-list').html('No evaluations available');
                }

                updateStatus();

            } catch (error) {
                console.error('Error:', error);
                $status.html('Communication Error');
            }
        }

        var config = {
            draggable: true,
            position: 'start',
            orientation: 'white',  // User plays white, so show from white's perspective
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        }
        board = Chessboard('board', config)

        updateStatus()

        $('#resetBtn').on('click', function () {
            game.reset();
            board.start();
            updateStatus();
            $('#evaluations-list').html('No moves evaluated yet');
            $('#ai-eval').text('Selected Move Probability: 0.0000');
        });

        $('#flipBtn').on('click', board.flip);
    </script>
</body>

</html>
