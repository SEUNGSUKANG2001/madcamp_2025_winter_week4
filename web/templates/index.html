<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess AI - Play against Maxlegrec/ChessBot</title>

    <!-- Robust Chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --white-win: #3fb950;
            --black-win: #f85149;
            --draw: #8b949e;
            --board-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            /* FORCE HORIZONTAL */
            gap: 3rem;
            max-width: 1200px;
            width: 95%;
            padding: 2rem;
            align-items: flex-start;
            justify-content: center;
        }

        /* Chessboard.js fix for vertical stacking if CSS fails to load properly */
        .chessboard-63f28 {
            box-sizing: content-box;
        }

        .board-b72b1 {
            border: 5px solid #30363d !important;
            border-radius: 4px;
            box-shadow: var(--board-shadow);
        }

        .board-section {
            flex: 0 0 500px;
            /* Fixed width for the board */
            position: relative;
        }

        #myBoard {
            width: 100%;
        }

        .info-section {
            flex: 1;
            min-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            border: 1px solid #30363d;
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent-color);
            letter-spacing: -0.5px;
        }

        .status {
            margin-bottom: 2rem;
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .eval-container {
            margin-top: 1rem;
        }

        .evaluation-bar {
            height: 28px;
            background: #21262d;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            margin-top: 0.8rem;
            border: 1px solid #30363d;
        }

        .eval-section {
            height: 100%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .eval-black {
            background-color: var(--black-win);
        }

        .eval-draw {
            background-color: var(--draw);
        }

        .eval-white {
            background-color: var(--white-win);
        }

        .eval-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .advantage-badge {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent-color);
        }

        .top-moves-list {
            list-style: none;
            padding: 0;
            margin: 1.2rem 0 0 0;
        }

        .top-move-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #30363d;
            transition: all 0.2s;
        }

        .top-move-item:last-child {
            border-bottom: none;
        }

        .top-move-item:hover {
            background: rgba(88, 166, 255, 0.05);
            transform: translateX(4px);
        }

        .move-notation {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: #e6edf3;
            font-size: 1.2rem;
            background: #21262d;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }

        .move-prob {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        button {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            border: 1px solid #30363d;
            background-color: #21262d;
            color: #c9d1d9;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        button#resetBtn:hover {
            border-color: var(--black-win);
            color: var(--black-win);
        }

        #loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(88, 166, 255, 0.1);
            border-left-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Color Selection Modal */
        #color-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .color-modal-content {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
            text-align: center;
            max-width: 500px;
        }

        .color-modal-content h2 {
            margin: 0 0 1rem 0;
            font-size: 2.2rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .color-modal-content p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .color-choice-btns {
            display: flex;
            gap: 1.5rem;
        }

        .color-choice-btn {
            flex: 1;
            padding: 2rem 1.5rem;
            border-radius: 16px;
            border: 2px solid #30363d;
            background: #21262d;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .color-choice-btn:hover {
            border-color: var(--accent-color);
            background: rgba(88, 166, 255, 0.1);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(88, 166, 255, 0.2);
        }

        .piece-icon {
            font-size: 4rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .board-section {
                flex: 0 0 auto;
                width: 100%;
                max-width: 500px;
            }

            .info-section {
                width: 100%;
                max-width: 500px;
                min-width: auto;
            }
        }
    </style>
</head>

<body>

    <div id="color-modal">
        <div class="color-modal-content">
            <h2>Choose Your Color</h2>
            <p>Select which side you want to play as</p>
            <div class="color-choice-btns">
                <button class="color-choice-btn" onclick="selectColor('white')">
                    <span class="piece-icon">♔</span>
                    <span>Play as White</span>
                </button>
                <button class="color-choice-btn" onclick="selectColor('black')">
                    <span class="piece-icon">♚</span>
                    <span>Play as Black</span>
                </button>
            </div>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 1.5rem; font-weight: 300; letter-spacing: 1px;">AI IS THINKING</p>
    </div>

    <div class="container">
        <div class="board-section">
            <div id="myBoard"></div>
            <div class="controls">
                <button id="resetBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M1.172 8A6.828 6.828 0 1 1 8 14.828V13.5A5.5 5.5 0 1 0 2.5 8H4L2 10.5 0 8h1.172z" />
                    </svg>
                    Reset Game
                </button>
                <button id="flipBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path
                            d="M8 3.293l2.146 2.147a.5.5 0 0 0 .708-.708L8 1.879 5.146 4.732a.5.5 0 1 0 .708.708L8 3.293zm-.5 9.414L5.354 10.56a.5.5 0 1 0-.708.708L8 14.121l2.854-2.853a.5.5 0 0 0-.708-.708L8.5 12.707V3.293z" />
                    </svg>
                    Flip Board
                </button>
                <button id="undoBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path
                            d="M8.22 2.97a.75.75 0 0 1 1.06 0L14.03 7.72a.75.75 0 0 1 0 1.06l-4.75 4.75a.75.75 0 0 1-1.06-1.06L12.44 8.25H1.5a.75.75 0 0 1 0-1.5h10.94L8.22 4.03a.75.75 0 0 1 0-1.06z"
                            transform="rotate(180 8 8)" />
                    </svg>
                    Undo
                </button>
            </div>
        </div>

        <div class="info-section">
            <div class="card">
                <h1>Chess AI</h1>
                <div id="status" class="status">Your turn (White)</div>

                <div class="eval-container">
                    <label
                        style="font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;">Live
                        Analysis</label>
                    <div class="evaluation-bar" id="evalBar">
                        <div class="eval-section eval-black" style="width: 33.33%"></div>
                        <div class="eval-section eval-draw" style="width: 33.34%"></div>
                        <div class="eval-section eval-white" style="width: 33.33%"></div>
                    </div>
                    <div class="eval-labels">
                        <span id="prob-black">0.0%</span>
                        <span id="prob-draw">100.0%</span>
                        <span id="prob-white">0.0%</span>
                    </div>
                    <div style="text-align: center;">
                        <div id="advantage-text" class="advantage-badge">
                            Score: 0.00
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2
                    style="font-size: 1rem; margin: 0; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px;">
                    Top 5 Engine Moves</h2>
                <ul class="top-moves-list" id="topMovesList">
                    <li style="padding: 1rem; color: var(--text-secondary); font-style: italic; text-align: center;">
                        Make a move to see AI analysis...</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');
        var $topMovesList = $('#topMovesList');
        var $loading = $('#loading-overlay');
        var playerColor = null; // 'white' or 'black'

        function selectColor(color) {
            playerColor = color;
            $('#color-modal').hide();

            // Configure board orientation
            var config = {
                draggable: true,
                position: 'start',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                orientation: color,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('myBoard', config);
            updateStatus();

            // If playing as black, AI makes first move
            if (color === 'black') {
                window.setTimeout(makeAiMove, 500);
            } else {
                // If playing as white, show suggestions for player's first move
                window.setTimeout(showPlayerSuggestions, 300);
            }
        }

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;

            // Prevent dragging opponent's pieces
            if (playerColor === 'white' && piece.search(/^b/) !== -1) return false;
            if (playerColor === 'black' && piece.search(/^w/) !== -1) return false;
        }

        function showPlayerSuggestions() {
            // Show AI suggestions for player's turn
            fetch('/api/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fen: game.fen() })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error(data.error);
                        return;
                    }
                    updateAnalysis(data);
                })
                .catch(err => {
                    console.error('Fetch error:', err);
                });
        }

        function makeAiMove() {
            $loading.css('display', 'flex');

            fetch('/api/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fen: game.fen() })
            })
                .then(response => response.json())
                .then(data => {
                    $loading.hide();
                    if (data.error) {
                        console.error(data.error);
                        return;
                    }

                    // Execute AI move
                    game.move({
                        from: data.move.slice(0, 2),
                        to: data.move.slice(2, 4),
                        promotion: 'q'
                    });

                    board.position(game.fen());
                    updateStatus();
                    updateAnalysis(data);

                    // Show suggestions for player's next move
                    window.setTimeout(showPlayerSuggestions, 300);
                })
                .catch(err => {
                    $loading.hide();
                    console.error('Fetch error:', err);
                });
        }

        function updateAnalysis(data) {
            if (!data || !data.position_value) return;

            const val = data.position_value.raw;
            const b = val[0] * 100;
            const d = val[1] * 100;
            const w = val[2] * 100;

            $('.eval-black').css('width', b + '%');
            $('.eval-draw').css('width', d + '%');
            $('.eval-white').css('width', w + '%');

            $('#prob-black').text('Black: ' + b.toFixed(1) + '%');
            $('#prob-draw').text('Draw: ' + d.toFixed(1) + '%');
            $('#prob-white').text('White: ' + w.toFixed(1) + '%');

            const score = data.position_value.score;
            $('#advantage-text').text('Advantage: ' + (score > 0 ? '+' : '') + score.toFixed(2));

            if (score > 0.5) $('#advantage-text').css('color', 'var(--white-win)');
            else if (score < -0.5) $('#advantage-text').css('color', 'var(--black-win)');
            else $('#advantage-text').css('color', 'var(--accent-color)');

            $topMovesList.empty();
            data.top_moves.forEach(m => {
                $topMovesList.append(`
                <li class="top-move-item">
                    <span class="move-notation">${m.move}</span>
                    <span class="move-prob">${m.prob.toFixed(1)}%</span>
                </li>
            `);
            });
        }

        function onDrop(source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();
            window.setTimeout(makeAiMove, 250);
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function updateStatus() {
            var status = '';
            var moveColor = 'White';
            if (game.turn() === 'b') moveColor = 'Black';

            if (game.in_checkmate()) {
                status = 'CHECKMATE • ' + (moveColor === 'White' ? 'Black' : 'White') + ' WINS';
            } else if (game.in_draw()) {
                status = 'DRAW';
            } else {
                status = moveColor.toUpperCase() + ' TO MOVE';
                if (game.in_check()) {
                    status += ' • IN CHECK';
                }
            }

            $status.html(status);
        }

        // Board will be initialized after color selection

        $('#resetBtn').on('click', function () {
            // Show color selection modal again
            $('#color-modal').show();
            playerColor = null;
            game.reset();
            if (board) board.start();
            updateStatus();
            $topMovesList.html('<li style="padding: 1rem; color: var(--text-secondary); font-style: italic; text-align: center;">Make a move to see AI analysis...</li>');
            $('.eval-black').css('width', '33.33%');
            $('.eval-draw').css('width', '33.34%');
            $('.eval-white').css('width', '33.33%');
            $('#prob-black').text('0.0%');
            $('#prob-draw').text('100.0%');
            $('#prob-white').text('0.0%');
            $('#advantage-text').text('Score: 0.00');
        });

        $('#flipBtn').on('click', function () {
            if (board) board.flip();
        });

        $('#undoBtn').on('click', function () {
            game.undo();
            game.undo();
            board.position(game.fen());
            updateStatus();
        });
    </script>

</body>

</html>
